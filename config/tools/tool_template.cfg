# KlipperXL-Plus per-tool config - template for tool T{N} = Dwarf {D} = MCU dwarf_t{N} (wire address 0x8{D}).
# INSTALLER-OWNED: generated by kxlplus_config.py for each DETECTED tool; replaced on update.
# Everything this tool needs is here, so a printer with fewer tools simply has fewer files.
# No per-printer calibration value may be set here (docs/RELEASE_CONFIG.md): pressure_advance,
# the heater PID values, the loadcell counts_per_gram / reference_tare_counts and the
# filament sensor cal live in printer.cfg / SAVE_CONFIG.
# Every value VERIFIED on the owner's printer 2026-10-02/03 unless marked.
# Pins: Prusa-Firmware-Buddy @1ce23f33 src/common/hwio_pindef_XL_dwarf.h.

[serial_bridge dwarf_t{N}]
dwarf_index: {D}
# KlipperXL-Plus Dwarf firmware (patches 0009/0010, flashed by the installer) locks
# itself to its bootloader-assigned address at boot, so the bridge brings it up
# without the bus to itself (no starved clock sync on the running Dwarfs).
self_addressed: True
[mcu dwarf_t{N}]
serial: /tmp/klipper_host_dwarf_t{N}
[temperature_sensor dwarf_t{N}_mcu]
sensor_type: temperature_mcu
sensor_mcu: dwarf_t{N}

[{EXT}]
# E0 STEP PD1 / DIR PD0 INVERTED (owner saw reverse with plain PD0) / ENA PD2 active-low (l.6-11);
# 380 steps/mm @16 -> 8.421 (Configuration_XL_Dwarf.h l.435)
step_pin: dwarf_t{N}:PD1
dir_pin: !dwarf_t{N}:PD0
enable_pin: !dwarf_t{N}:PD2
microsteps: 16
rotation_distance: 8.421
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 4.0
max_extrude_only_distance: 300
# HEAT0 PA6 (l.77-78), TEMP_0 PA5 (l.52-53); thermistor_2005.h 104NT-4-R025H42G, 1000 ohm pull-up;
# min 5, max 305 (Configuration_XL_Dwarf.h l.171,206-208).  control + pid_Kp/Ki/Kd are
# seeded in printer.cfg (Prusa 14/1/100, l.163): PID_CALIBRATE saves all four
# (pid_calibrate.py), and SAVE_CONFIG refuses any of them set in an included file.
# pressure_advance likewise.
heater_pin: dwarf_t{N}:PA6
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: dwarf_t{N}:PA5
pullup_resistor: 1000
min_temp: 5
max_temp: 305

[heater_fan T{N}_heatbreak_fan]
# FAN1 PC6 (l.65-67). On above 35 C or while a target is set (owner). Prusa: ~36 C, always on > 45 C.
pin: dwarf_t{N}:PC6
heater: {EXT}
heater_temp: 35.0
fan_speed: 1.0
kick_start_time: 0.5

[temperature_sensor T{N}_klipper_heatbreak]
# TEMP_HEATBREAK PB2 (l.55-56); thermistor_2008.h 100k B4267, 33000 ohm divider
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: dwarf_t{N}:PB2
pullup_resistor: 33000
min_temp: -10
max_temp: 150

[fan_generic T{N}_print_fan]
# FAN PC7 (l.61-63)
pin: dwarf_t{N}:PC7

[output_pin T{N}_light]
# nozzle light PC11 PWM (l.107-108)
pin: dwarf_t{N}:PC11
pwm: True
cycle_time: 0.010
value: 0

[xl_status_led T{N}]
# status LED: one WS2812-type on PB6 (l.83-84), xl_status_led.py.
# xl_toolchanger shows stock's states on it (Dwarf module_marlin.cpp
# l.90-96): picked white, off its dock orange, docked green.
pin: dwarf_t{N}:PB6

[xl_tool_buttons T{N}]
# the tool's two buttons, active low with pull-up: up PA15, down PC10
# (l.86-90, 134-135) - up retracts, down extrudes (xl_tool_buttons.py)
up_pin: ^!dwarf_t{N}:PA15
down_pin: ^!dwarf_t{N}:PC10

[lis3dh T{N}]
# the tool's accelerometer for input shaper: LIS2DH12 (WHO_AM_I 0x33, which
# Klipper's lis3dh driver checks; 1344 Hz as released) on SPI2 = SCK PB13,
# MISO PB14, MOSI PB15 (Prusa src/device/stm32g0/hal_msp.cpp) = the Dwarf
# firmware's spi2 bus; CS PB11 (hwio_pindef_XL_dwarf.h ACC_CS)
cs_pin: dwarf_t{N}:PB11
spi_bus: spi2
# released KlipperXL axes map (printer X = chip z, Y = chip y, Z = chip x);
# gravity reads on the chip's X at rest (T0 10/08: x 9193, y 0, z 0)
axes_map: z, y, x

[tmc2130 {EXT}]
# CS_E PB4 (l.49-50); SOFTWARE SPI PB3/PD6/PD5 (verified IOIN 0x11; hardware SPI2 is the accelerometer);
# Rsense 0.22, interpolate, no stealthChop (Configuration_XL_Dwarf_adv.h l.713-714,750-752,820).
# 450 mA and the chopper as a stock print runs them: once the tools are up the
# XLBuddy pushes its own E driver state to the Dwarf (puppy_task.cpp l.740,
# stepperE0 is Remote) = E0_CURRENT 450 (Configuration_XL_adv.h l.763), tmc_init
# tbl=1 + CHOPPER_PRUSAMK3_24V {3,-2,6} = TOFF 3, HEND 1, HSTRT 5 (trinamic.cpp
# l.136-140, tmc_util.h l.59). The Dwarf's own boot default is 400 mA.
cs_pin: dwarf_t{N}:PB4
spi_software_sclk_pin: dwarf_t{N}:PB3
spi_software_mosi_pin: dwarf_t{N}:PD6
spi_software_miso_pin: dwarf_t{N}:PD5
run_current: 0.450
sense_resistor: 0.220
interpolate: True
stealthchop_threshold: 0
driver_TBL: 1
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

[xl_tool_fsensor T{N}]
# tool filament sensor: Klipper ADC on the Dwarf PA4 (xl_tool_fsensor.py); 'cal' per printer
pin: dwarf_t{N}:PA4

[xl_dock_sensors T{N}]
# dock hall sensors (Prusa Cheese.hpp): picked PA1, parked PA2
picked_pin: dwarf_t{N}:PA1
parked_pin: dwarf_t{N}:PA2

[xl_load_cell_probe T{N}]
# this tool's loadcell as a Z probe (HX717 PA3/PA0, 320 sps, A-128).  Prusa thresholdStatic
# 125 g (common/loadcell.hpp:260-261).  sample_retract_dist 0.5 = horizontal_move_z (owner).
# counts_per_gram (Prusa 0.0192 g/count = 52.083) is seeded in printer.cfg; reference_tare_counts
# is measured per printer.  Both are saved by Klipper's load cell calibration.
sensor_type: hx717
dout_pin: dwarf_t{N}:PA3
sclk_pin: dwarf_t{N}:PA0
sample_rate: 320
gain: A-128
trigger_force: 125
z_offset: 0
sample_retract_dist: 0.5
