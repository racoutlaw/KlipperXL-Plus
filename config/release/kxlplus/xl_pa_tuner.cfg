# =============================================================================
# KlipperXL-Plus - automatic per-tool Pressure Advance (released "XLPATuner Road B")
# INSTALLER-OWNED: replaced on every KlipperXL-Plus update.
#
# The released sweep (config/pa_tuner.cfg + pa_menu.cfg @1b681b3), move for
# move.  It was ported from the gcode PrusaPATuner actually ran on his stock XL
# (PETG 240, XL5IS) and verified line by line:
#   park/purge X30 Y30 Z80; X oscillates 30 <-> 31 (1 mm) so PA applies
#   (composite XYE moves: F = XY speed, E slaved); flow is VOLUMETRIC -
#   slow 3.0 mm^3/s for 2.0 s, fast 14.0 mm^3/s for 0.714 s, first slow leg
#   x5 (warm-up) -> slow E2.4945 F30.00, fast E4.1575 F84.00, warm-up
#   E12.4726 F6.00 at 1.75 mm; preheat = test + 10; baseline G4 P500 then
#   2 s; Z marker 80 -> 82 -> 80 with a 100 ms hold, then G4 P500 (the
#   analyser's 0.5 s pre-roll); accel 5000.
# Released deliberate deviations from the stock gcode: M83 relative E (same
#   motion); no M591 (Buddy stuck detection); no park/M84 at the end (the tool
#   stays picked); SET_VELOCITY_LIMIT instead of M201/M204.
# Released measurements behind the defaults:
#   K 0.02..0.12 - widened 08/16: with 0.02..0.07 one tool's optimum sat
#     past the end, bd_k_opt was clipped at the edge and the estimators
#     disagreed; with 0.02..0.12 they agreed.  Keep the optimum INSIDE the
#     range.
#   STEP 0.005 x CYCLES 6 = 21 values, ~6 min.  CYCLES 6 is a floor: the
#     analyser drops a K with < 4 included segments (inclusion 67-85 %);
#     CYCLES 4 rejected every K (08/15).
# ORDER: G28 COLD (a failed home/park must not leave a hot nozzle) and BEFORE
#   the pick - G28 Z picks the probe tool T0, so pick-then-home would record
#   T0's loadcell as the other tool's K.
# Mess: ~848 mm (~2.5 g PLA) is extruded in free air at Z80 onto the cold bed.
#
# KlipperXL-Plus (the only changes): the loadcell comes from xl_pa_tuner (Klipper
# load cell, picked tool); each tool is its own extruder, so after the sweep
# that extruder gets its OWN previous pressure advance back (the release set 0
# and its tool-change wrapper re-applied the stored K at the next pick -
# KlipperXL-Plus has no wrapper; a failed analysis would otherwise leave 0).
# =============================================================================

[gcode_macro CALIBRATE_PA]
description: PA sweep against the picked tool's loadcell (released stock-matched run)
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_PA
    {% set TOOL     = params.TOOL|default(-1)|int %}
    {% set TEMP     = params.TEMP|default(240)|float %}
    {% set PREHEAT  = params.PREHEAT|default(TEMP + 10)|float %}
    {% set START_K  = params.START_K|default(0.02)|float %}
    {% set END_K    = params.END_K|default(0.12)|float %}
    {% set STEP_K   = params.STEP_K|default(0.005)|float %}
    {% set CYCLES   = params.CYCLES|default(6)|int %}
    {% set SLOW_FLOW = params.SLOW_FLOW|default(3.0)|float %}
    {% set FAST_FLOW = params.FAST_FLOW|default(14.0)|float %}
    {% set SLOW_HALF = params.SLOW_HALF_S|default(2.0)|float %}
    {% set FAST_HALF = params.FAST_HALF_S|default(0.714286)|float %}
    {% set WARMUP   = params.WARMUP_FACTOR|default(5.0)|float %}
    {% set FIL_D    = params.FILAMENT_D|default(1.75)|float %}
    {% set OSC      = params.OSC_MM|default(1.0)|float %}
    {% set ACCEL    = params.ACCEL|default(5000)|float %}
    {% set Z_MARKER = params.Z_MARKER_MM|default(2.0)|float %}
    {% set BASELINE = params.BASELINE_S|default(2.0)|float %}
    {% set POLL     = params.POLL|default(0.020)|float %}
    {% set DO_HOME  = params.HOME|default(1)|int %}
    {% set X_BASE   = params.X|default(30.0)|float %}
    {% set Y_BASE   = params.Y|default(30.0)|float %}
    {% set Z_BASE   = params.Z|default(80.0)|float %}

    # the tool this sweep measures, its extruder and its current K
    {% set T = TOOL if TOOL >= 0 else printer.xl_toolchanger.active_tool|int %}
    {% if T < 0 %}
        { action_raise_error("CALIBRATE_PA: no tool picked - give TOOL=n") }
    {% endif %}
    {% set EXT = 'extruder' if T == 0 else 'extruder%d' % T %}
    {% if EXT not in printer %}
        { action_raise_error("CALIBRATE_PA: T%d is not installed" % T) }
    {% endif %}
    {% set OLD_K = printer[EXT].pressure_advance %}

    # filament cross-section -> mm of filament per mm^3
    {% set AREA   = 3.14159265 * (FIL_D / 2.0) * (FIL_D / 2.0) %}
    {% set SLOW_E = (SLOW_FLOW / AREA) * SLOW_HALF %}
    {% set FAST_E = (FAST_FLOW / AREA) * FAST_HALF %}
    {% set WARM_E = SLOW_E * WARMUP %}
    # F = XY trajectory speed of the composite move; E finishes in the same time
    {% set SLOW_F = (OSC / SLOW_HALF) * 60 %}
    {% set FAST_F = (OSC / FAST_HALF) * 60 %}
    {% set WARM_F = (OSC / (SLOW_HALF * WARMUP)) * 60 %}

    {% set steps   = ((END_K - START_K) / STEP_K)|round|int %}
    {% set total_e = ((steps + 1) * CYCLES * (SLOW_E + FAST_E)) + (WARM_E - SLOW_E) %}
    {% set restore_accel = printer.configfile.settings.printer.max_accel %}

    RESPOND MSG="CALIBRATE_PA: T{T} K {START_K}..{END_K} step {STEP_K} = {steps|int + 1} values x {CYCLES} cycles"
    RESPOND MSG="CALIBRATE_PA: slow E{SLOW_E|round(4)} F{SLOW_F|round(2)} | fast E{FAST_E|round(4)} F{FAST_F|round(2)} | warmup E{WARM_E|round(4)} F{WARM_F|round(2)}"
    RESPOND MSG="CALIBRATE_PA: ~{total_e|round(0)}mm filament in free air at Z{Z_BASE}, osc {OSC}mm"

    SAVE_GCODE_STATE NAME=pa_sweep_state
    G90
    {% if DO_HOME %}
    G28
    {% endif %}
    {% if TOOL >= 0 %}
    T{TOOL}
    M400
    {% endif %}
    G1 X{X_BASE} Y{Y_BASE} Z{Z_BASE} F6000
    M400

    M104 S{PREHEAT}
    M109 S{PREHEAT}
    M83
    # a pulled-back filament (auto retract after a load / print end) is given
    # back HERE, hot and before the recording - otherwise xl_filament gives it
    # back on the first forward G1 E = the first sweep leg, ~2.6 s of push
    # inside the recording after sweep_t0 (owner 10/11)
    XL_GIVE_BACK
    SET_VELOCITY_LIMIT ACCEL={ACCEL}

    G4 P500                                ; settle (stock: G4 P500 before baseline)
    START_PA_RECORDING POLL={POLL}

    {% if BASELINE > 0 %}
    RESPOND MSG="PA_BASELINE"
    G4 P{(BASELINE * 1000)|int}            ; static-load baseline / noise reference
    {% endif %}

    M104 S{TEMP}                           ; drop to test temp (stock does this here)

    {% if Z_MARKER > 0 %}
    G1 Z{Z_BASE + Z_MARKER} F1800          ; sweep_t0 marker UP
    G4 P100
    G1 Z{Z_BASE} F1800                     ; marker DOWN = sweep_t0
    {% endif %}
    RESPOND MSG="PA_SWEEP_START"
    G4 P500

    {% for i in range(steps + 1) %}
        {% set CURRENT_K = START_K + (i * STEP_K) %}
        SET_PRESSURE_ADVANCE ADVANCE={CURRENT_K}
        M118 K={CURRENT_K}
        {% for c in range(CYCLES) %}
            {% if i == 0 and c == 0 %}
            G1 X{X_BASE + OSC} E{WARM_E|round(4)} F{WARM_F|round(2)}
            {% else %}
            G1 X{X_BASE + OSC} E{SLOW_E|round(4)} F{SLOW_F|round(2)}
            {% endif %}
            G1 X{X_BASE} E{FAST_E|round(4)} F{FAST_F|round(2)}
        {% endfor %}
    {% endfor %}

    G1 X{X_BASE + OSC} E{SLOW_E|round(4)} F{SLOW_F|round(2)}   ; trailing slow leg
    M400
    RESPOND MSG="PA_SWEEP_END"

    STOP_PA_RECORDING TEMP={TEMP} START_K={START_K} END_K={END_K} STEP_K={STEP_K} CYCLES={CYCLES} SLOW_FLOW={SLOW_FLOW} FAST_FLOW={FAST_FLOW} SLOW_HALF_S={SLOW_HALF} FAST_HALF_S={FAST_HALF} WARMUP_FACTOR={WARMUP} OSC_MM={OSC} ACCEL={ACCEL} Z_MARKER_MM={Z_MARKER} BASELINE_S={BASELINE} FILAMENT_D={FIL_D}

    SET_PRESSURE_ADVANCE EXTRUDER={EXT} ADVANCE={OLD_K}
    M104 S0
    SET_VELOCITY_LIMIT ACCEL={restore_accel}
    RESTORE_GCODE_STATE NAME=pa_sweep_state
    RESPOND MSG="CALIBRATE_PA: done - recording written, T{T} back on its K {OLD_K}"

# Fine grid: 0.002 x 10 cycles.  Over the full 0.02-0.12 that is ~23 MINUTES -
# run the plain sweep first, then a NARROW band, e.g. for a coarse 0.065:
#     CALIBRATE_PA_FINE TOOL=2 TEMP=215 START_K=0.05 END_K=0.08   (~7 min)
[gcode_macro CALIBRATE_PA_FINE]
description: High-resolution PA sweep (0.002 step) - narrow the range or it runs ~23min
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_PA_FINE
    CALIBRATE_PA START_K={params.START_K|default(0.02)} END_K={params.END_K|default(0.12)} STEP_K={params.STEP_K|default(0.002)} CYCLES={params.CYCLES|default(10)} TEMP={params.TEMP|default(240)} TOOL={params.TOOL|default(-1)} HOME={params.HOME|default(1)} POLL={params.POLL|default(0.020)}

# One button per tool (released pa_menu.cfg): home -> pick -> heat -> sweep ->
# analyse -> that tool's K is LIVE, then the console says to run SAVE_CONFIG
# (SAVECONFIG=1 saves and restarts by itself).  Mainsail/KlipperScreen build
# the TEMP / FILAMENT / SAVECONFIG fields from the params below.  TEMP 215 =
# PLA; PETG e.g. PA_TUNE_T1 TEMP=240 FILAMENT=PETG.
[gcode_macro _PA_TUNE_RUN]
description: internal - sweep, analyse and apply one tool's PA
gcode:
    {% set TOOL = params.TOOL|int %}
    {% set TEMP = params.TEMP|default(215)|float %}
    {% set FIL  = params.FILAMENT|default('PLA') %}
    {% set SC   = params.SAVECONFIG|default(0)|int %}
    # Refused while printing OR paused: it homes Z, which probes onto the part
    # (released: cost a real 88-minute print).
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("PA_TUNE refused: a print is %s. This homes Z and would probe onto the part." % printer.print_stats.state) }
    {% endif %}
    RESPOND MSG="PA_TUNE: T{TOOL} at {TEMP}C ({FIL}) - sweep + analyse, ~6 min."
    CALIBRATE_PA TOOL={TOOL} TEMP={TEMP}
    ANALYZE_PA TOOL={TOOL} SAVE=1 SAVECONFIG={SC} FILAMENT={FIL}

[gcode_macro PA_TUNE_T0]
description: Auto-tune Pressure Advance for T0 (sweep, analyse, apply)
gcode:
    _PA_TUNE_RUN TOOL=0 TEMP={params.TEMP|default(215)} FILAMENT={params.FILAMENT|default('PLA')} SAVECONFIG={params.SAVECONFIG|default(0)}

