# =============================================================================
# KlipperXL-Plus - side LED strip status animations (released KlipperXL
# config/led_effects.cfg @1b681b3, effects unchanged; leds re-pointed from
# neopixel:side_leds to the KlipperXL-Plus strip xl_leds:side_leds)
# INSTALLER-OWNED: replaced on every KlipperXL-Plus update.
#
# OPTIONAL - needs the third-party klipper-led_effect plugin
# (https://github.com/julianschill/klipper-led_effect); Klipper refuses to
# start on [led_effect] sections without it.  Enable in YOUR printer.cfg,
# after the xl_base include:
#   [include kxlplus/xl_led_effects.cfg]
# The _status_* macros that switch these live in xl_macros.cfg and do nothing
# when this file is not included.
#
# Hardware (Prusa led_manager.cpp:119-133, xl_leds.py): ONE side-strip chain
# of 2 drivers for BOTH sides - left and right always show the same.
#   (1) = driver 1: the RGB colour
#   (2) = driver 2: RED channel = the white LEDs, GREEN = the XL enclosure fan
# Effects on (2) use the red channel only, so they never touch the fan.
# The front strip (xl_leds front_leds) is left off.
# =============================================================================

# --- IDLE: gentle white breathing ---
[led_effect effect_idle]
autostart: true
frame_rate: 24
leds:
    xl_leds:side_leds (2)
layers:
    breathing 5 1 top (0.1, 0.0, 0.0)

# --- HEATING: orange breathing ---
[led_effect effect_heating]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 3 1 top (1.0, 0.3, 0.0)

# --- HOMING: blue chase ---
[led_effect effect_homing]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 2 1 top (0.0, 0.3, 1.0)

# --- LEVELING: purple breathing ---
[led_effect effect_leveling]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 4 1 top (0.5, 0.0, 0.8)

# --- MESHING: yellow-green breathing ---
[led_effect effect_meshing]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 3 1 top (0.4, 0.8, 0.0)

# --- PRINTING: white solid ---
[led_effect effect_printing]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (2)
layers:
    static 0 0 top (0.4, 0.0, 0.0)

# --- PRINT COMPLETE: green solid ---
[led_effect effect_complete]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    static 0 0 top (0.0, 1.0, 0.0)

# --- PAUSED: yellow breathing ---
[led_effect effect_paused]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 2 1 top (1.0, 1.0, 0.0)

# --- ERROR: red strobe ---
[led_effect effect_error]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    strobe 1 1.5 add (1.0, 0.0, 0.0)
    breathing 2 0 difference (0.95, 0.0, 0.0)

# --- CALIBRATING: cyan breathing ---
[led_effect effect_calibrating]
autostart: false
frame_rate: 24
leds:
    xl_leds:side_leds (1)
layers:
    breathing 3 1 top (0.0, 0.8, 0.8)
