# =============================================================================
# KlipperXL-Plus - print macros (START_PRINT / END_PRINT / cancel)
# INSTALLER-OWNED: replaced on every KlipperXL-Plus update.  Put your own macros in
# printer.cfg.  The sequence is the released KlipperXL one (config/printer.cfg
# @1b681b3 l.700-936), with each released-only command replaced by what
# KlipperXL-Plus actually has:
#   T0-T4 / TOOL_PARK          -> T0-T4 / XL_PARK (xl_toolchanger)
#   puppy_bootloader.active_tool -> xl_toolchanger.active_tool
#   SET_DWARF_TEMP DWARF=n TEMP=0 -> M104 T<n-1> S0 (each tool is an extruder)
#   printer.extruder.*        -> the ACTIVE tool's extruder
#   DISABLE_ALL_HOTENDS        -> TURN_OFF_HEATERS (the modular bed too -
#                                 xl_puppies extends it, as the release did)
#   _status_* LED effects      -> same call sites; the macros are defined
#                                 here and switch the effects of the
#                                 optional kxlplus/xl_led_effects.cfg
# =============================================================================

# Runtime state only (melt-zone flags) - never calibrations (docs/RELEASE_CONFIG.md)
[save_variables]
filename: ~/printer_data/config/variables.cfg

# Object list for the slicer / Mainsail (released KlipperXL)
[exclude_object]

# Mainsail's babystep (+/-) sends SET_GCODE_OFFSET Z_ADJUST=..; store it in the
# picked tool's Z fine-tune slot, staged for SAVE_CONFIG (released behaviour)
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _BASE_SET_GCODE_OFFSET
gcode:
    _BASE_SET_GCODE_OFFSET {rawparams}
    {% if 'Z_ADJUST' in (rawparams | upper) %}
        SAVE_TOOL_Z_OFFSET
    {% endif %}

[gcode_macro START_PRINT]
description: Start print (KlipperXL-Plus, multi-tool)
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    {% set PROBE_TEMP = 150 %}
    {% set TOOL = params.TOOL|default(0)|int %}
    # TOOLS = how many tools this job uses (the slicer supplies it).  Absent
    # (older sliced files) -> 0 -> the multi-tool path.
    {% set TOOLS = params.TOOLS|default(0)|int %}
    {% set TOTAL_LAYER_COUNT = params.TOTAL_LAYER_COUNT|default(0)|int %}
    {% set SINGLE = (TOOLS == 1) %}
    # Single-tool jobs home Z with the printing nozzle; multi-tool with T0.
    {% set PROBE_TOOL = TOOL if SINGLE else 0 %}
    {% set X0 = params.X0|default(30)|float %}
    {% set Y0 = params.Y0|default(30)|float %}
    {% set X1 = params.X1|default(330)|float %}
    {% set Y1 = params.Y1|default(330)|float %}

    # Prusa-style probe spacing: ~30 mm between probes, 4..12 per axis
    {% set PROBE_SPACING = 30 %}
    {% set probe_x = (((X1 - X0) / PROBE_SPACING) | round(0, 'ceil') | int) + 1 %}
    {% set probe_y = (((Y1 - Y0) / PROBE_SPACING) | round(0, 'ceil') | int) + 1 %}
    {% set probe_x = [[probe_x, 4] | max, 12] | min %}
    {% set probe_y = [[probe_y, 4] | max, 12] | min %}

    RESPOND MSG="Starting print - Bed:{BED_TEMP}C Tool:T{TOOL} Temp:{EXTRUDER_TEMP}C"
    SPOOL_JOIN_RESET            ; a join from an earlier print never carries over
    _status_heating
    {% if TOTAL_LAYER_COUNT > 0 %}
        SET_PRINT_STATS_INFO TOTAL_LAYER={TOTAL_LAYER_COUNT} CURRENT_LAYER=0
    {% endif %}

    # 1: adaptive bed area + bed heat (non-blocking)
    SET_BED_AREA X0={X0} Y0={Y0} X1={X1} Y1={Y1}
    M140 S{BED_TEMP}

    # 2: home XY
    _status_homing
    RESPOND MSG="Homing XY..."
    G28 X Y

    # 3: probe tool on the carriage (T<n> parks any other tool first).  The Z
    # datum is declared FIRST: T<n> refuses an uncalibrated tool during a
    # print unless it is a single-tool job's own homing tool, and that is
    # only known once the datum is set (G28 Z below sets the same again).
    SET_Z_DATUM_TOOL TOOL={PROBE_TOOL} SINGLE={1 if SINGLE else 0}
    RESPOND MSG="Picking T{PROBE_TOOL} for probing..."
    T{PROBE_TOOL}
    # 3b: stock (probe.cpp): the probe tool's filament pulled back 20 mm
    # unless it already is, so the nozzle is empty while it probes the bed -
    # heated for it to the job temperature (the print tool) or its own
    # target / 215 C.  M109 at print temperature gives it back (xl_filament).
    XL_PROBE_RETRACT TOOL={PROBE_TOOL}{% if PROBE_TOOL == TOOL %} TEMP={EXTRUDER_TEMP}{% endif %}
    M104 T{PROBE_TOOL} S{PROBE_TEMP}

    # 4: bed + probe tool at temperature
    _status_heating
    RESPOND MSG="Waiting for bed {BED_TEMP}C and T{PROBE_TOOL} probe temp {PROBE_TEMP}C..."
    M190 S{BED_TEMP}
    M109 T{PROBE_TOOL} S{PROBE_TEMP}
    G4 P2000                  ; thermal stabilisation

    # 5: home Z with the probe tool's loadcell (released fast/slow taps)
    _status_leveling
    RESPOND MSG="Homing Z with loadcell on T{PROBE_TOOL}{% if SINGLE %} (single-tool datum){% endif %}..."
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=probe_tool VALUE={PROBE_TOOL}
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=single VALUE={1 if SINGLE else 0}
    G28 Z

    # 5b: optional nozzle clean - a hook for printer.cfg, nothing here by
    # default.  If [gcode_macro _KXL_NOZZLE_CLEAN] exists (e.g. a brush
    # wipe) it runs now that Z is known, then Z is homed again so the datum
    # and the mesh are taken with the cleaned nozzle.  Back to the bed centre
    # first: the clean may end next to a frame edge, and the XY stall homing
    # inside G28 Z needs room to run (after G28 Z the head is at the centre).
    {% if 'gcode_macro _kxl_nozzle_clean' in printer.configfile.settings %}
        RESPOND MSG="Cleaning T{PROBE_TOOL}'s nozzle, then homing Z again..."
        _KXL_NOZZLE_CLEAN TOOL={PROBE_TOOL}
        G90
        G1 Z10 F600
        G1 X180 Y180 F6000
        SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=probe_tool VALUE={PROBE_TOOL}
        SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=single VALUE={1 if SINGLE else 0}
        G28 Z
    {% endif %}

    # 6: adaptive bed mesh
    _status_meshing
    RESPOND MSG="Bed mesh ({probe_x}x{probe_y}) for area ({X0},{Y0}) to ({X1},{Y1})"
    BED_MESH_CALIBRATE MESH_MIN={X0},{Y0} MESH_MAX={X1},{Y1} PROBE_COUNT={probe_x},{probe_y}

    # 7: probe tool heater off if it is not the print tool
    {% if TOOL != PROBE_TOOL %}
        M104 T{PROBE_TOOL} S0
    {% endif %}

    # 8: print tool on the carriage - UNCONDITIONAL (a macro is rendered
    # before it runs, so it cannot see which tool homing left picked;
    # picking the picked tool is a no-op)
    RESPOND MSG="Ensuring print tool T{TOOL} is picked..."
    T{TOOL}

    # 9: print tool to print temperature
    _status_heating
    G1 X10 Y10 Z10 F3000
    RESPOND MSG="Heating T{TOOL} to {EXTRUDER_TEMP}C..."
    M104 T{TOOL} S{EXTRUDER_TEMP}
    M109 T{TOOL} S{EXTRUDER_TEMP}

    # 10: prime line beside the print area (released: length clamped to the
    # bed and slid, not shortened; extrusion from the line length; relative E)
    {% set PRIME_LEN = 100 %}
    {% set prime_x  = [(X0 - 5), 10] | max %}
    {% set prime_y1 = [[Y0, 10] | max + PRIME_LEN, 350] | min %}
    {% set prime_y0 = [prime_y1 - PRIME_LEN, 10] | max %}
    {% set plen     = prime_y1 - prime_y0 %}
    # 1.75 mm filament = 2.4053 mm^2; W x 0.3 mm bead
    {% set e_wide   = (plen * 0.60 * 0.3 / 2.4053)|round(4) %}
    {% set e_norm   = (plen * 0.45 * 0.3 / 2.4053)|round(4) %}
    M83                                                    ; relative E
    G1 X{prime_x} Y{prime_y0} Z0.3 F3000
    # give back anything still pulled back (stock does it on the first
    # extrusion; step 9's M109 normally did already).  XL_GIVE_BACK reads the
    # amount when it runs - this macro was rendered before step 9.
    G1 Z4 F1000
    XL_GIVE_BACK TOOL={TOOL}
    G1 Z0.3 F1000
    G1 X{prime_x} Y{prime_y1} E{e_wide} F1000              ; fat pass: purge
    G1 X{prime_x + 0.5} Y{prime_y1} F3000
    G1 X{prime_x + 0.5} Y{prime_y0} E{e_norm} F1000        ; clean pass: wipe
    G1 Z2 F1000

    _status_printing
    RESPOND MSG="Print starting with T{TOOL}..."

# Side LED status (released led_effects.cfg @1b681b3 l.105-162, same names).
# The effects are in the optional kxlplus/xl_led_effects.cfg (needs the
# klipper-led_effect plugin); without it every _status_* does nothing (the
# release printed "Unknown command" for each call instead).
[gcode_macro _KXL_LED_EFFECT]
description: Switch the side LEDs to one effect, if it is configured
gcode:
    {% set effect = params.EFFECT|default('')|lower %}
    {% if ('led_effect ' ~ effect) in printer.configfile.settings %}
        STOP_LED_EFFECTS
        SET_LED_EFFECT EFFECT={effect}
    {% endif %}

[gcode_macro _status_off]
gcode:
    {% if 'led_effect effect_idle' in printer.configfile.settings %}
        STOP_LED_EFFECTS
    {% endif %}

[gcode_macro _status_idle]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_idle

[gcode_macro _status_heating]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_heating

[gcode_macro _status_homing]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_homing

[gcode_macro _status_leveling]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_leveling

[gcode_macro _status_meshing]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_meshing

[gcode_macro _status_printing]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_printing

[gcode_macro _status_complete]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_complete
    UPDATE_DELAYED_GCODE ID=_complete_timeout DURATION=30

[gcode_macro _status_paused]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_paused

[gcode_macro _status_error]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_error

[gcode_macro _status_calibrating]
gcode:
    _KXL_LED_EFFECT EFFECT=effect_calibrating

[delayed_gcode _complete_timeout]
gcode:
    _status_idle

# Tool buttons for Mainsail (released printer.cfg @1b681b3 l.630-640,
# l.1086-1092).  T0-T4 / XL_PARK are Python commands (xl_toolchanger) and
# Mainsail only draws buttons for gcode_macros.  Released TOOL_PARK ->
# KlipperXL-Plus XL_PARK.
[gcode_macro _ASSERT_NOT_PRINTING]
description: internal - refuse a command that would disturb a running print
gcode:
    {% set WHAT = params.WHAT|default("This command") %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("%s refused: a print is %s. It homes, probes or moves the toolhead and would wreck the running job." % (WHAT, printer.print_stats.state)) }
    {% endif %}

[gcode_macro PICK_TOOL]
description: Pick up a tool (use T=0-4) - homes X/Y first if they are not homed
gcode:
    {% set tool = params.T|default(0)|int %}
    # owner 10/06: not homed -> home X/Y, then pick (the released TOOL_PICK
    # homed by itself; KlipperXL-Plus's pick refuses without X/Y).  G28 X Y is
    # the released homing_override: bed down 10 mm, then Y and X.
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        RESPOND MSG="PICK_TOOL: X/Y not homed - homing X Y first"
        G28 X Y
    {% endif %}
    T{tool}

[gcode_macro PARK_TOOL]
description: Park current tool - homes X/Y first if they are not homed
gcode:
    _ASSERT_NOT_PRINTING WHAT=PARK_TOOL
    # owner 10/06: as PICK_TOOL - not homed -> home X/Y, then park
    {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
        RESPOND MSG="PARK_TOOL: X/Y not homed - homing X Y first"
        G28 X Y
    {% endif %}
    XL_PARK

# Z alignment - the released PRUSA_Z_LEVEL (KlipperXL printer.cfg @1b681b3
# l.385-444), same moves.  Both Z motors share one driver: the bed is driven
# up into the top frame at Prusa's Z_CURRENT 0.7 A so the side that lags
# catches up (Prusa G162 calib_Z), then backed off 5 mm.  KlipperXL-Plus changes:
# the picked tool comes from xl_toolchanger and is parked with XL_PARK; and Z
# is left NOT homed at the end, as stock G162 leaves it - its height is now
# counted from the top frame, not the bed, and [xl_z_memory] would otherwise
# keep it across a restart.  The Z alignment wizard homes right after.
[gcode_macro PRUSA_Z_LEVEL]
description: Crash-based Z leveling (from Prusa G162.cpp reference)
gcode:
    _ASSERT_NOT_PRINTING WHAT=PRUSA_Z_LEVEL
    # Constants from Prusa firmware G162.cpp
    {% set RAM_SPEED = 15 %}         # Z_CALIB_ALIGN_AXIS_FEEDRATE = 15 mm/s
    {% set BACKOFF = 5 %}            # Z_CALIB_EXTRA_HIGHT = 5 mm
    {% set CRASH_CURRENT = 0.7 %}    # Z_CURRENT = 700mA from Configuration_XL_adv.h

    M117 Starting Prusa Z leveling...

    # Step 1: Move bed DOWN for initial clearance.  FORCE_MOVE, not
    # SET_KINEMATIC_POSITION Z=0 + G1 Z10: that marks X and Y homed too
    # (force_move.py) - after a restart at X=0 Y=0 - and the G28 X Y below
    # gave that to the lock bump as the real position: its fast move to the
    # right edge drove the carriage blind into the frame (owner 10/10, from
    # T4's dock).  FORCE_MOVE moves only the Z motor (+ = bed down) and leaves
    # every axis's homed state alone.  Same fix in the released KlipperXL.
    FORCE_MOVE STEPPER=stepper_z DISTANCE=10 VELOCITY={RAM_SPEED}
    M400

    # Step 2: Home XY only
    G28 X Y
    M400

    # Step 3: Move to corner
    G0 X10 Y10 F6000
    M400

    # Step 4: Park tool if picked
    {% set tc = printer.xl_toolchanger %}
    {% if tc.active_tool >= 0 %}
        { action_respond_info("Tool T%d is picked - parking first" % tc.active_tool) }
        SET_KINEMATIC_POSITION Z=100
        XL_PARK
        M400
    {% else %}
        { action_respond_info("No tool picked - proceeding") }
    {% endif %}

    # Step 5: Save and set crash current (0.7A - Z_CURRENT from Prusa firmware)
    {% set z_config = printer.configfile.settings['tmc2130 stepper_z'] %}
    {% set z_run_current = z_config.run_current %}
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={CRASH_CURRENT}
    G4 P300

    # Step 6: Ram Z motors into top frame
    M117 Ramming to align Z motors...
    FORCE_MOVE STEPPER=stepper_z DISTANCE=-400 VELOCITY={RAM_SPEED}
    M400

    # Step 7: Back off
    M117 Backing off...
    FORCE_MOVE STEPPER=stepper_z DISTANCE={BACKOFF} VELOCITY={RAM_SPEED}
    M400

    # Step 8: Restore current
    SET_TMC_CURRENT STEPPER=stepper_z CURRENT={z_run_current}
    G4 P300

    # Step 9: Set position and move to safe height
    SET_KINEMATIC_POSITION Z={BACKOFF}
    G1 Z50 F{RAM_SPEED * 60}
    M400
    # Z height is from the top frame now - not homed, as stock G162 leaves it
    SET_KINEMATIC_POSITION CLEAR_HOMED=Z

    M117 Z level complete - run G28 Z to home

[gcode_macro STALLGUARD_Z_ALIGN]
description: Alias for PRUSA_Z_LEVEL
gcode:
    _ASSERT_NOT_PRINTING WHAT=STALLGUARD_Z_ALIGN
    PRUSA_Z_LEVEL

# Dock calibration (released printer.cfg @1e677ba UI wrapper; DOCK_CALIBRATE
# itself is in xl_toolchanger.py)
[gcode_macro DOCK_CAL]
description: Calibrate dock positions
gcode:
    _ASSERT_NOT_PRINTING WHAT=DOCK_CAL
    DOCK_CALIBRATE {rawparams}

# Load / Unload buttons.  KlipperScreen's extrude screen only offers them when
# a [gcode_macro] named LOAD_FILAMENT / UNLOAD_FILAMENT exists
# (panels/extrude.py l.20-22) - the xl_filament commands are not macros, so
# its Unload said "Macro UNLOAD_FILAMENT not found" (printer 10/06, runout
# pause).  These two take the names over and pass everything on unchanged
# (KlipperScreen adds SPEED=, which the Prusa load/unload ignores).  No TOOL =
# the picked tool.
[gcode_macro LOAD_FILAMENT]
rename_existing: _KXL_LOAD_FILAMENT
description: Load filament (Prusa M701) - TOOL=n, default the picked tool
gcode:
    _KXL_LOAD_FILAMENT {rawparams}

[gcode_macro UNLOAD_FILAMENT]
rename_existing: _KXL_UNLOAD_FILAMENT
description: Unload filament (Prusa M702) - TOOL=n, default the picked tool
gcode:
    _KXL_UNLOAD_FILAMENT {rawparams}

# Filament buttons (released filament_macros.cfg @1b681b3) - Mainsail's
# Load/Unload buttons find these too.  No TOOL = the picked tool, T0 when none
# is picked (the release always used T0: during a T2 runout pause that would
# have changed tools mid-print and unloaded the wrong one).
# TEMP=0 = the tool's current target, else 215 C (fits PLA and PETG).
[gcode_macro FILAMENT_LOAD]
description: Load filament into a tool (Prusa M701 sequence)
gcode:
    {% set _picked = printer.xl_toolchanger.active_tool %}
    {% set TOOL = params.TOOL|default(_picked if _picked is not none and _picked|int >= 0 else 0)|int %}
    {% set TEMP = params.TEMP|default(0)|float %}
    {% if TOOL < 0 or TOOL > 4 %}
        { action_raise_error("FILAMENT_LOAD: TOOL must be 0-4, got %d" % TOOL) }
    {% endif %}
    RESPOND MSG="FILAMENT_LOAD: T{TOOL} - it picks the tool, goes to the front and turns the extruder: push filament in until the gears grab."
    LOAD_FILAMENT TOOL={TOOL} TEMP={TEMP}

[gcode_macro FILAMENT_UNLOAD]
description: Unload filament from a tool (Prusa M702 sequence)
gcode:
    {% set _picked = printer.xl_toolchanger.active_tool %}
    {% set TOOL = params.TOOL|default(_picked if _picked is not none and _picked|int >= 0 else 0)|int %}
    {% set TEMP = params.TEMP|default(0)|float %}
    {% if TOOL < 0 or TOOL > 4 %}
        { action_raise_error("FILAMENT_UNLOAD: TOOL must be 0-4, got %d" % TOOL) }
    {% endif %}
    RESPOND MSG="FILAMENT_UNLOAD: T{TOOL} - to the front, then out (cold if its filament is already pulled out of the nozzle, else heating and ramming first)."
    UNLOAD_FILAMENT TOOL={TOOL} TEMP={TEMP}

[gcode_macro FILAMENT_SENSORS]
description: Show filament sensor states and calibration for all tools
gcode:
    QUERY_SIDE_SENSORS
    QUERY_TOOL_FSENSOR

# Spool join (released print_macros.cfg @1b681b3 l.194-202): during a runout
# pause, carry on with another tool that has the same filament - it parks the
# empty tool, picks T, heats it to the print temperature, then press RESUME.
[gcode_macro JOIN_SPOOL]
description: Continue print with a different tool (enter tool number)
gcode:
    {% if params.T is defined %}
        SPOOL_JOIN TO={params.T|int}
    {% else %}
        RESPOND MSG="Usage: JOIN_SPOOL T=3 (tool number to continue with)"
    {% endif %}

# Input shaper - the released macros (KlipperXL printer.cfg @1b681b3
# l.971-997).  KlipperXL-Plus only: [resonance_tester] reads T0's accelerometer,
# so T0 goes on the carriage first (the released G28 left T0 picked).
[gcode_macro _KXL_IS_PREP]
description: internal - home if needed, then T0 on the carriage
gcode:
    {% if not 'xyz' in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if printer.xl_toolchanger.active_tool != 0 %}
        XL_PICK TOOL=0
    {% endif %}

[gcode_macro CALIBRATE_INPUT_SHAPER]
description: Run Input Shaper calibration (requires homing first)
gcode:
    _ASSERT_NOT_PRINTING WHAT=CALIBRATE_INPUT_SHAPER
    _KXL_IS_PREP
    SHAPER_CALIBRATE

[gcode_macro TEST_RESONANCES_X]
description: Test X axis resonances only
gcode:
    _ASSERT_NOT_PRINTING WHAT=TEST_RESONANCES_X
    _KXL_IS_PREP
    TEST_RESONANCES AXIS=X

[gcode_macro TEST_RESONANCES_Y]
description: Test Y axis resonances only
gcode:
    _ASSERT_NOT_PRINTING WHAT=TEST_RESONANCES_Y
    _KXL_IS_PREP
    TEST_RESONANCES AXIS=Y

# Calibration wizards (xl_wizards.py): guided dialogs, one tool at a time.
# XL_WIZARD is a Python command; KlipperScreen and Mainsail list gcode_macros.
[gcode_macro CALIBRATION_WIZARDS]
description: Guided calibrations - loadcell reference, heater PID, filament sensors, tool offsets, Z alignment, input shaper, pressure advance
gcode:
    XL_WIZARD

# Nozzle light buttons (released light_macros.cfg).  NOZZLE_LEDS is a Python
# command (xl_toolchanger); Mainsail only draws buttons for gcode_macros.
# They set a POLICY: pick/park switch the light.  Not saved across a restart.
[gcode_macro NOZZLE_LIGHTS_ON]
description: Nozzle lights follow the active tool (normal)
gcode:
    NOZZLE_LEDS STATE=ON

[gcode_macro NOZZLE_LIGHTS_OFF]
description: Nozzle lights off on every tool
gcode:
    NOZZLE_LEDS STATE=OFF

[gcode_macro NOZZLE_LIGHTS_ALWAYS]
description: Nozzle lights on always, even parked in the dock
gcode:
    NOZZLE_LEDS STATE=ALWAYS

# Slicer "Before layer change" G-code (released profile):
#   _ON_LAYER_CHANGE LAYER={layer_num + 1}
# Feeds Klipper's own layer counter (Mainsail shows "layer N / total").
[gcode_macro _ON_LAYER_CHANGE]
description: Layer counter for Mainsail (slicer before-layer-change G-code)
gcode:
    SET_PRINT_STATS_INFO CURRENT_LAYER={params.LAYER|default(0)|int}

# Mainsail's CANCEL_PRINT (mainsail.cfg, loaded after these files - it owns
# the name) runs _KXL_CANCEL_PRINT after its TURN_OFF_HEATERS / M106 S0 and
# before CANCEL_PRINT_BASE (user_cancel_macro).
[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_KXL_CANCEL_PRINT"
# Mainsail's own cancel retract OFF: the cancel's 20 mm melt-zone retract is
# the one recorded for the next START_PRINT; Mainsail's default 5 mm on top
# put 25 mm back with 20 booked (printer 10/06) - released: "only 20mm was
# booked, so the next print would start short".
variable_cancel_retract: 0.0
# side LEDs as released PAUSE/RESUME (print_macros.cfg @1b681b3 l.43, 70);
# Mainsail runs these after PAUSE_BASE / before RESUME_BASE
variable_user_pause_macro: "_status_paused"
variable_user_resume_macro: "_KXL_RESUME"
# PAUSE / RESUME = the released ones (print_macros.cfg @1b681b3 l.39-79) =
# stock Prusa XL (Configuration_XL.h l.1462-1463 NOZZLE_PARK_XY_FEEDRATE 100,
# NOZZLE_PARK_Z_FEEDRATE 5; Configuration_XL_adv.h l.949-950 retract 1 mm at
# 10.8 mm/s): retract 1, lift 20 at 5 mm/s, park front left X3 Y10 at
# 100 mm/s; RESUME puts 1.5 back at 10.8 mm/s and returns at 100 mm/s.
# Mainsail's defaults would park at X356 Y456 (max - 5) - T4's dock - with a
# 2 mm lift.  The released PAUSE also ran BED_MESH_CLEAR, which nothing
# reloaded: the rest of the print ran without the mesh.  Not ported - stock
# keeps the mesh, and the park move is uncompensated anyway (20 mm lift >
# fade_end 10, bed_mesh.py get_z_factor = 0).
variable_use_custom_pos: True
variable_custom_park_x: 3.0
variable_custom_park_y: 10.0
variable_custom_park_dz: 20.0
variable_retract: 1.0
variable_speed_retract: 10.8
# the 1.5 mm put back on RESUME is done by _KXL_RESUME (below), before an
# optional nozzle clean - Mainsail's own unretract would come after it
variable_unretract: 0.0
variable_speed_unretract: 10.8
variable_speed_hop: 5.0
variable_speed_move: 100.0
gcode:
    # variable container only - never invoked directly

# Stock Prusa safety timer (safety_timer.cpp, XL interval 30 min -
# safety_timer.hpp l.39; released KlipperXL timeout 1800): with nothing
# happening for 30 min, a PAUSED print turns its nozzles off and keeps the
# bed and motors (stock stepper_timeout: "Never disable motors during print
# (or print pause)"), so RESUME can still go back to the print; otherwise
# every heater goes off (TURN_OFF_HEATERS - the modular bed too) and the
# motors.  Klipper's default (600 s, TURN_OFF_HEATERS + M84) lost the homing
# in a long pause, and RESUME could not move back.
[idle_timeout]
timeout: 1800
gcode:
    {% if printer.pause_resume.is_paused %}
        {% set _saved = {} %}
        {% for _h in printer.heaters.available_heaters if _h.startswith('extruder') %}
            {% if printer[_h].target > 0 %}
                {% set _ = _saved.update({_h: printer[_h].target}) %}
            {% endif %}
            SET_HEATER_TEMPERATURE HEATER={_h} TARGET=0
        {% endfor %}
        SET_GCODE_VARIABLE MACRO=_KXL_RESUME VARIABLE=heaters VALUE="{_saved}"
        RESPOND MSG="Pause timeout: nozzle heaters off (bed and motors stay on). RESUME heats them again."
    {% else %}
        TURN_OFF_HEATERS
        M84
    {% endif %}

# Run by Mainsail's RESUME before RESUME_BASE (user_resume_macro), after it
# has re-heated the picked tool if the pause timed out.  Stock restores every
# nozzle (safety_timer.cpp reset_restore); the others are set here.  Then the
# pause retract is put back - stock unretracts exactly what PAUSE pulled, 1 mm
# (pause.cpp unpark, ADVANCED_PAUSE_RESUME_PRIME 0; the release put back
# 1.5 mm) - and - on a
# printer that defines _KXL_RESUME_CLEAN in its own printer.cfg (a nozzle
# brush) - a nozzle clean after it, so the ooze of the pause stays off the
# part.  Mainsail's RESUME then returns to the print.
[gcode_macro _KXL_RESUME]
description: Resume steps - run by Mainsail's RESUME
variable_heaters: {}
variable_unretract: 1.0
variable_speed_unretract: 10.8
gcode:
    _status_printing
    {% for _h, _t in heaters.items() if _h != printer.toolhead.extruder %}
        SET_HEATER_TEMPERATURE HEATER={_h} TARGET={_t}
    {% endfor %}
    {% if printer[printer.toolhead.extruder].can_extrude %}
        SAVE_GCODE_STATE NAME=_kxl_resume
        M83
        G1 E{unretract} F{speed_unretract * 60}
        RESTORE_GCODE_STATE NAME=_kxl_resume
    {% endif %}
    {% if 'gcode_macro _kxl_resume_clean' in printer.configfile.settings %}
        _KXL_RESUME_CLEAN
    {% endif %}
    {% set _none = {} %}
    SET_GCODE_VARIABLE MACRO=_KXL_RESUME VARIABLE=heaters VALUE="{_none}"

# The released CANCEL_PRINT (print_macros.cfg @1b681b3 l.82-140), in its
# order: melt-zone retract while hot (recorded), bed off, lift 20 mm, mesh
# cleared before the XY move, head to X3 Y350, tool parked, motors off.
# Heaters and the print fan are already off (Mainsail).  Spool joins
# cleared (released SPOOL_JOIN_RESET, after the park).
[gcode_macro _KXL_CANCEL_PRINT]
description: Cancel steps (released CANCEL_PRINT) - run by Mainsail's CANCEL_PRINT
gcode:
    # LEDs: red for the cancel, idle after 5 s (released l.88, 143; Mainsail
    # has no hook after CANCEL_PRINT_BASE)
    _status_error
    UPDATE_DELAYED_GCODE ID=_complete_timeout DURATION=5
    # stock (marlin_server.cpp pre_finalize_print): the picked tool's
    # filament out of the nozzle while it is still hot, remembered for the
    # next print (xl_filament XL_AUTO_RETRACT - skipped when too cold)
    XL_AUTO_RETRACT
    # bed: target 0 FIRST, then the area (CLEAR_BED_AREA re-heats the whole
    # bed while a target is still set - as END_PRINT)
    M140 S0
    CLEAR_BED_AREA
    {% if 'xyz' in printer.toolhead.homed_axes %}
        # lift 20 mm (Prusa cancels with a 20 mm Z lift) - only as far as Z
        # can go, so a tall print cannot stop the park with "out of range"
        {% set _dz = [20.0, printer.toolhead.axis_maximum.z - printer.toolhead.position.z]|min %}
        {% if _dz > 0 %}
            G91
            G1 Z{_dz} F300
            G90
        {% endif %}
        BED_MESH_CLEAR          ; before the XY move (released: compensation crash)
        G0 X3 Y350 F6000        ; to the back (Prusa: X=3, Y=350)
        XL_PARK
    {% else %}
        RESPOND MSG="Cancel: XYZ not homed - no lift / park"
        BED_MESH_CLEAR
    {% endif %}
    SPOOL_JOIN_RESET
    M84

[gcode_macro END_PRINT]
description: End print cleanup (KlipperXL-Plus)
gcode:
    # stock (marlin_server.cpp pre_finalize_print): the picked tool's
    # filament out of the nozzle while hot, remembered so the next print
    # gives it back (xl_filament XL_AUTO_RETRACT - skipped when too cold)
    XL_AUTO_RETRACT
    G91
    G1 Z10 F3000
    G90
    M106 S0
    BED_MESH_CLEAR
    G1 X10 Y340 F6000         ; rear, clear of the print
    XL_PARK
    SPOOL_JOIN_RESET          ; the release kept a join after a finished print
    # every tool heater off (however many tools this XL has)
    TURN_OFF_HEATERS
    # bed: target 0 FIRST, then drop the area - KlipperXL-Plus's CLEAR_BED_AREA
    # re-heats the whole bed only while a target is still set
    # (xl_puppies.cmd_CLEAR_BED_AREA / set_bed_target)
    M140 S0
    CLEAR_BED_AREA
    M84 X Y E
    _status_complete
    RESPOND MSG="Print complete!"
