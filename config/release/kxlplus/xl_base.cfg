# =============================================================================
# KlipperXL-Plus - shared Prusa XL config (every XL, any tool count)
# INSTALLER-OWNED: replaced on every KlipperXL-Plus update.  Do not edit - put
# changes in printer.cfg.  No per-printer calibration value may be set here:
# SAVE_CONFIG refuses an option that an included file sets
# (klippy/configfile.py _disallow_include_conflicts) - docs/RELEASE_CONFIG.md.
# =============================================================================

[printer]
# released KlipperXL values (printer.cfg l.45-51)
kinematics: corexy
max_velocity: 600
max_accel: 5000
max_z_velocity: 12
max_z_accel: 200
square_corner_velocity: 8.0

# Modular bed (stock Prusa firmware) + Dwarf reset lines + boot order
[xl_puppies]

# The modular bed as Klipper's heater_bed: Mainsail / Fluidd / KlipperScreen
# show a bed with a target box and presets.  Not Klipper's heater_bed module:
# [xl_puppies] above already made the 'heater_bed' object, so this section
# attaches to it (klippy.py load_object) - the bed's own firmware heats.
# Keep it AFTER [xl_puppies].
[heater_bed]
min_temp: 0
max_temp: 120
# KlipperScreen's number pad reads 'control' (pid / mpc -> a calibrate
# button); the bed's own firmware regulates it, Klipper cannot tune it
control: watermark

# RS485 bridge to the Dwarfs (KlipperXL-Plus XLBuddy firmware)
[serial_bridge]

# At every start: does each board run the firmware this KlipperXL-Plus built?
# If not, a Mainsail warning names the boards and says to run the installer
# (xl_fw_check.py; IDs from ~/kxlplus-build/*/fw_id)
[xl_fw_check]

[force_move]
enable_force_move: True

# Bed height kept across a Klipper restart (xl_z_memory.py) - the next X/Y
# home uses it instead of dropping the bed 10 mm ([homing_override] below)
[xl_z_memory]

# Side filament sensors: XLBuddy ADC + mux (xl_side_sensors.py).
# Per-tool calibration cal_tN lives in printer.cfg / SAVE_CONFIG.
[xl_side_sensors]

# Filament load / unload / autoload / M600 (xl_filament.py, released
# KlipperXL sequences).  Autoload: push filament into a side sensor while
# the printer is idle.  SET_AUTOLOAD ENABLE=0 turns it off until restart.
[xl_filament]

# Guided calibrations on KlipperScreen / Mainsail (xl_wizards.py,
# docs/CALIBRATION_WIZARDS.md).  Progress across the SAVE_CONFIG restarts is
# kept in [save_variables] (xl_macros.cfg).
[xl_wizards]

# Tool offsets on the calibration pin - the released CALIBRATE_TOOL_OFFSETS,
# same moves (xl_tool_offsets.py); run from the wizards (Tool offsets) or as
# CALIBRATE_TOOL_OFFSETS [DRY_RUN=1].  Saves [xl_toolchanger] offset_tN.
[xl_tool_offsets]

# Side + front LED strips (xl_leds.py)
[xl_leds side_leds]
strip: side
chain_count: 2
color_order: RGB

[xl_leds front_leds]
strip: front
chain_count: 3
color_order: GRB

# Loadcell probe router: the picked tool's loadcell is the printer probe.
# Must come before the per-tool [xl_load_cell_probe Tn] sections (tools/tN.cfg).
[xl_load_cell_probe]

[stepper_x]
step_pin: PD7
dir_pin: PD6
enable_pin: !PB9
microsteps: 16
rotation_distance: 40
endstop_pin: PE13
position_min: -8
position_endstop: -8
position_max: 361
homing_speed: 52
homing_retract_dist: 20
second_homing_speed: 52
homing_positive_dir: false

[tmc2130 stepper_x]
cs_pin: PG15
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.650
hold_current: 0.650
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
# Stall homing + chopper = stock's PAIR: SGT 1 (X/Y_STALL_SENSITIVITY,
# Configuration_XL_adv.h l.938-939) with tbl=1 (stock tmc_init hard-codes it,
# trinamic.cpp l.136) and CHOPPER_PRUSAMK3_24V {3,-2,6} = TOFF 3, HEND 1,
# HSTRT 5 (tmc_util.h l.59, Configuration_XL_adv.h l.849).  The chopper changes
# the StallGuard reading, so SGT and TBL only ever change TOGETHER, then re-test
# homing (G28 Y alone from mid-bed first: a false stall then moves only 21 mm).
# History: 2026-08-15 tuned SGT 0 WITH TBL 2 (1 = hard touch, 0 = soft, -1 =
# false triggers).  10/12: TBL 1 with SGT 0 stalled Y early -> head into the
# docks.  10/12 owner: try the full stock pair TBL 1 + SGT 1.
driver_SGT: 1
driver_SFILT: 1
driver_TBL: 1
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

[stepper_y]
step_pin: PD5
dir_pin: PD4
enable_pin: !PB9
microsteps: 16
rotation_distance: 40
endstop_pin: PG9
position_min: -9
position_endstop: -9
position_max: 461
homing_speed: 52
homing_retract_dist: 20
second_homing_speed: 52
homing_positive_dir: false

[tmc2130 stepper_y]
cs_pin: PB5
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.650
hold_current: 0.650
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
# Stall homing + chopper: stock's pair, see stepper_x (SGT and TBL change
# only together, then re-test homing)
driver_SGT: 1
driver_SFILT: 1
driver_TBL: 1
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

[stepper_z]
# Left Z motor
step_pin: PD3
dir_pin: !PD2
enable_pin: !PB8
microsteps: 16
rotation_distance: 4
endstop_pin: ^PB4
# For loadcell-based Z homing with SET_KINEMATIC_POSITION, position_endstop
# must be 0. With Prusa-style loadcell probing, Z=0 = nozzle at bed surface.
# Tool offsets from CALIBRATE_TOOL_OFFSETS handle all tool-to-tool differences.
position_endstop: 0
position_min: -9
position_max: 360
homing_speed: 8
second_homing_speed: 1

[tmc2130 stepper_z]
cs_pin: PG10
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11
run_current: 0.700
hold_current: 0.700
stealthchop_threshold: 0
interpolate: True
sense_resistor: 0.220
diag1_pin: ^PB4
# Chopper as stock (see stepper_x)
driver_TBL: 1
driver_TOFF: 3
driver_HEND: 1
driver_HSTRT: 5

[homing_override]
axes: xyz
gcode:
    {% set HOME_CUR = 0.750 %}
    {% set driver_config = printer.configfile.settings['tmc2130 stepper_x'] %}
    {% set RUN_CUR = driver_config.run_current %}
    {% set home_x = 'X' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_y = 'Y' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% set home_z = 'Z' in params or not ('X' in params or 'Y' in params or 'Z' in params) %}
    {% if home_z %}
    {% set home_x = True %}
    {% set home_y = True %}
    {% endif %}
    # Safety: move bed away from nozzle first (released homing_override).
    # KlipperXL-Plus (owner item A, 10/07): a bed height that is KNOWN - Z homed
    # this session, or kept across a Klipper restart by [xl_z_memory] - stays
    # the real one instead of being faked to 0, and the bed only goes down if
    # it is under 10 mm.  The released fake (Z=0, 10 mm down) is kept for a
    # full G28 and when the height is unknown.
    {% set HOMED = printer.toolhead.homed_axes %}
    {% set Z_KNOWN = 'z' in HOMED %}
    {% set Z_KEPT = printer.xl_z_memory.restored_z %}
    # The axis NOT being homed keeps its real position if it was homed (owner
    # 10/07: the released fake X=180 Y=180 left Mainsail's "Home X" believing
    # Y=180 with the head at Y12 - a crash into the frame on the next Y move;
    # "Home Y" the same for X); one that was not homed stays not homed
    # (CLEAR_HOMED below) - never trusted at a fake 180.
    {% set X_SET = printer.toolhead.position.x if ('x' in HOMED and not home_x) else 180 %}
    {% set Y_SET = printer.toolhead.position.y if ('y' in HOMED and not home_y) else 180 %}
    # Z the same (owner 10/12): an X/Y-only home with the bed height unknown
    # fakes Z=0 below only to drop the bed 10 mm for clearance, and
    # SET_KINEMATIC_POSITION marks every axis homed - so Z is cleared again at
    # the end, as stock leaves Z un-homed after a G28 X Y (pause.cpp
    # unhomed_z_lift never homes Z).  Printer 10/12: an autoload from unhomed
    # left Z "homed" at a made-up height.
    {% set Z_FAKE = not home_z and not Z_KNOWN and Z_KEPT is none %}
    {% set CLEAR = ('x' if not (home_x or 'x' in HOMED) else '') ~ ('y' if not (home_y or 'y' in HOMED) else '') ~ ('z' if Z_FAKE else '') %}
    {% if home_z or (not Z_KNOWN and Z_KEPT is none) %}
    SET_KINEMATIC_POSITION X={X_SET} Y={Y_SET} Z=0
    G90
    G1 Z10 F600
    M400
    {% else %}
    {% set Z_NOW = printer.toolhead.position.z if Z_KNOWN else Z_KEPT %}
    SET_KINEMATIC_POSITION X={X_SET} Y={Y_SET} Z={Z_NOW}
    {% if not Z_KNOWN %}
    RESPOND MSG="Bed height {'%.2f' % Z_NOW} mm kept from the last restart"
    {% endif %}
    {% if Z_NOW < 10 %}
    G90
    G1 Z10 F600
    M400
    {% endif %}
    {% endif %}
    {% set RESTORE_ACCEL = printer.configfile.settings.printer.max_accel %}
    SET_VELOCITY_LIMIT ACCEL=1250
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={HOME_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={HOME_CUR}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_stall VALUE=1
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_x FIELD=TCOOLTHRS VALUE=300
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sfilt VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_stall VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_pushpull VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=TCOOLTHRS VALUE=300
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sfilt VALUE=0
    G4 P1000
    # Stock Prusa G28 (G28.cpp l.718-731), owner 10/08: homing X and Y with no
    # tool on the carriage -> bump the right edge to align the toolchanger
    # locking plates, then a bit left (xl_toolchanger XL_ALIGN_LOCKS; needs
    # the stall detection set above).  X/Y = the real position if homed.
    XL_ALIGN_LOCKS HOME_X={1 if home_x else 0} HOME_Y={1 if home_y else 0}{% if 'x' in HOMED %} X={printer.toolhead.position.x}{% endif %}{% if 'y' in HOMED %} Y={printer.toolhead.position.y}{% endif %}
    {% if home_y %}
    G28 Y0
    G90
    G1 Y12 F3000
    M400
    {% endif %}
    {% if home_x %}
    G28 X0
    G90
    G1 X10 F3000
    M400
    {% endif %}
    {% if CLEAR %}
    SET_KINEMATIC_POSITION CLEAR_HOMED={CLEAR}
    {% endif %}
    SET_TMC_FIELD STEPPER=stepper_x FIELD=diag1_stall VALUE=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=TCOOLTHRS VALUE=0
    SET_TMC_FIELD STEPPER=stepper_x FIELD=sfilt VALUE=1
    SET_TMC_FIELD STEPPER=stepper_y FIELD=diag1_stall VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=TCOOLTHRS VALUE=0
    SET_TMC_FIELD STEPPER=stepper_y FIELD=sfilt VALUE=1
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={RUN_CUR}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={RUN_CUR}
    SET_VELOCITY_LIMIT ACCEL={RESTORE_ACCEL}
    {% if home_z %}
    # Z: loadcell probe with the probe tool (default T0; START_PRINT sets the
    # job's first tool, as stock). Released homing_override Z part.
    {% set PROBE_TOOL = printer["gcode_macro _KXL_Z_DATUM"].probe_tool|int %}
    XL_PICK TOOL={PROBE_TOOL}
    G90
    G1 X180 Y180 F6000
    M400
    SET_KINEMATIC_POSITION Z=355
    # released LOADCELL_PROBE sequence: fast tap, back off, slow taps until
    # two agree within 0.030 mm, Z set from the last good slow tap
    XL_PROBE_Z
    {% set SINGLE_MODE = printer["gcode_macro _KXL_Z_DATUM"].single|int %}
    SET_Z_DATUM_TOOL TOOL={PROBE_TOOL} SINGLE={SINGLE_MODE}
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=probe_tool VALUE=0
    SET_GCODE_VARIABLE MACRO=_KXL_Z_DATUM VARIABLE=single VALUE=0
    G90
    G1 Z20 F600
    M400
    RESPOND MSG="Z homed with T{PROBE_TOOL} loadcell"
    {% endif %}

# Tool changer (Prusa dock sequences).  Tool offsets offset_tN and Z fine-tune
# z_adjust_tN / z_adjust_single_tN are per printer: printer.cfg / SAVE_CONFIG.
[xl_toolchanger]

[gcode_macro _KXL_Z_DATUM]
# which tool homes Z (released name); default T0 (a plain G28) - START_PRINT
# sets the job's first tool, one-shot
variable_probe_tool: 0
variable_single: 0
gcode:

# Print macros: START_PRINT / END_PRINT / cancel hook (installer-owned)
[include xl_macros.cfg]

# Automatic per-tool pressure advance (released XLPATuner): loadcell recorder +
# analyser hand-off (xl_pa_tuner.py; analyser in ~/pa_analysis + its own venv
# ~/pa_analysis_env), sweep + PA_TUNE_T0-T4 buttons in xl_pa_tuner.cfg
[xl_pa_tuner]
[include xl_pa_tuner.cfg]

# Resonance tester (released KlipperXL values, printer.cfg @1b681b3 l.647-651)
# on T0's accelerometer ([lis3dh T0], tools/t0.cfg) - the released one read
# the picked tool's Dwarf over MODBUS; here the chip is T0's, and the input
# shaper macros (xl_macros.cfg) put T0 on the carriage first.
[resonance_tester]
accel_chip: lis3dh T0
probe_points: 180, 180, 20
accel_per_hz: 75
hz_per_sec: 1

# Bed mesh (released KlipperXL values; START_PRINT passes the adaptive area)
[bed_mesh]
speed: 150
horizontal_move_z: 0.5
mesh_min: 30, 30
mesh_max: 330, 330
probe_count: 12, 12
algorithm: bicubic
fade_start: 1
fade_end: 10
